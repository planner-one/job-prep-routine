<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="운영 로드맵, 주간 실행 보드, 데일리 포커스 보드를 한곳에서 여는 로컬 홈">
    <title>취업 준비 루틴 보드</title>
    <link rel="stylesheet" href="./assets/routine.css">
  </head>
  <body>
    <div class="app-shell home-shell">
      <main class="daily-paper home-paper">
        <header class="home-header">
          <p class="eyebrow">LOCAL ROUTINE BOARD</p>
          <h1>취업 준비 루틴 보드</h1>
          <p>기준을 세우고, 한 주를 확인하고, 오늘의 실행에 집중하세요.</p>
        </header>

        <nav class="home-board-grid" aria-label="루틴 보드 선택">
          <a class="home-board-card home-board-card--roadmap" href="./roadmap.html">
            <span class="home-board-step">01</span>
            <strong>운영 로드맵</strong>
            <span>오늘 모드별 시간표와 학습 조합을 한눈에 봅니다.</span>
            <em>기준 열기 →</em>
          </a>

          <a class="home-board-card home-board-card--weekly" href="./weekly.html">
            <span class="home-board-step">02</span>
            <strong>주간 실행 보드</strong>
            <span>주간 진척과 선택한 요일의 실행 흐름을 함께 봅니다.</span>
            <em>주간 열기 →</em>
          </a>

          <a class="home-board-card home-board-card--daily" href="./daily.html">
            <span class="home-board-step">03</span>
            <strong>데일리 포커스 보드</strong>
            <span>오늘의 시간표와 지원 파이프라인을 바로 실행합니다.</span>
            <em>오늘 열기 →</em>
          </a>
        </nav>

        <p class="home-note">이 보드는 이 컴퓨터에서만 실행되며, 입력한 상태는 브라우저에 저장됩니다.</p>
      </main>
    </div>
  </body>
</html>
