<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="오늘의 취업 준비 일정과 면접 연습을 바로 이어가는 루틴 허브">
    <title>오늘의 취업 준비 | 취업 준비 루틴 보드</title>
    <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg?v=1">
    <link rel="stylesheet" href="./assets/site-shell.css?v=2">
    <link rel="stylesheet" href="./assets/routine.css?v=12">
  </head>
  <body class="site-body home-body">
    <header class="app-topbar screen-only">
      <a class="app-topbar-brand" href="./index.html" aria-label="취업 준비 루틴 보드 오늘">
        <img src="./assets/favicon.svg" alt="" width="28" height="28">
        <span>취업 준비 루틴 보드</span>
      </a>
      <nav aria-label="주요 이동">
        <a href="./index.html" aria-current="page">오늘</a>
        <a href="./weekly.html">주간</a>
        <a href="./interview/">면접</a>
        <a href="./roadmap.html">로드맵</a>
        <a href="./history.html">기록</a>
      </nav>
    </header>

    <div class="site-page home-page-shell">
      <main class="site-main home-main" id="home-page" aria-labelledby="home-title">
        <header class="home-intro">
          <p class="home-date"><time id="home-logical-date" datetime="">오늘</time></p>
          <h1 id="home-title">오늘 할 일부터 바로 시작해요</h1>
        </header>

        <section class="home-focus-grid" aria-label="오늘의 핵심 행동">
          <article class="home-card home-today-card">
            <header class="home-card-heading">
              <div>
                <p class="home-card-label">오늘 루틴</p>
                <h2>오늘 진척</h2>
              </div>
              <strong class="home-percent" id="home-daily-percent">0%</strong>
            </header>
            <div
              class="home-progress-track"
              id="home-daily-progress"
              role="progressbar"
              aria-label="오늘 루틴 완료율"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-valuenow="0"
            >
              <span class="home-progress-fill" id="home-daily-progress-fill"></span>
            </div>
            <p class="home-progress-count" id="home-daily-count">0 / 0 완료</p>
            <div class="home-next-action">
              <span>다음 미완료 일정</span>
              <strong id="home-next-schedule">오늘 일정을 확인해 주세요</strong>
            </div>
            <a class="home-primary-action" href="./daily.html">오늘 실행 이어가기</a>
          </article>

          <article class="home-card home-interview-card">
            <header class="home-card-heading">
              <div>
                <p class="home-card-label">면접 연습</p>
                <h2 id="home-interview-title">중급 루틴 시작</h2>
              </div>
              <strong class="home-session-count" id="home-interview-count">새 세션</strong>
            </header>
            <div class="home-interview-progress" id="home-interview-progress-wrap" hidden>
              <div
                class="home-progress-track"
                id="home-interview-progress"
                role="progressbar"
                aria-label="면접 세션 완료율"
                aria-valuemin="0"
                aria-valuemax="100"
                aria-valuenow="0"
              >
                <span class="home-progress-fill" id="home-interview-progress-fill"></span>
              </div>
            </div>
            <p class="home-interview-current" id="home-interview-current">핵심문장부터 짧게 답하는 중급 연습입니다.</p>
            <a
              class="home-primary-action home-primary-action--interview"
              id="home-interview-action"
              href="./interview/?view=difficulty&amp;routine=implementation"
            >중급 루틴 시작</a>
          </article>
        </section>

        <section class="home-card home-weekly-card" aria-labelledby="home-weekly-title">
          <header class="home-card-heading home-weekly-heading">
            <div>
              <p class="home-card-label">이번 주</p>
              <h2 id="home-weekly-title">주간 진척</h2>
            </div>
            <a class="home-text-link" href="./weekly.html">주간 보기</a>
          </header>
          <dl class="home-weekly-metrics">
            <div><dt>지원</dt><dd id="home-weekly-applications">0건</dd></div>
            <div><dt>내용 숙지</dt><dd id="home-weekly-reviews">0회</dd></div>
            <div><dt>면접</dt><dd id="home-weekly-interviews">0회</dd></div>
            <div><dt>운동</dt><dd id="home-weekly-exercise">0회</dd></div>
          </dl>
        </section>

        <nav class="home-quick-links" aria-label="루틴 바로가기">
          <a href="./roadmap.html"><span>로드맵</span><strong>운영 기준 확인</strong></a>
          <a href="./history.html"><span>기록</span><strong>누적 진척 보기</strong></a>
        </nav>
      </main>
    </div>

    <nav class="mobile-tabbar screen-only" aria-label="모바일 주요 이동">
      <a href="./index.html" aria-current="page">오늘</a>
      <a href="./weekly.html">주간</a>
      <a href="./interview/">면접</a>
      <a href="./roadmap.html">로드맵</a>
      <a href="./history.html">기록</a>
    </nav>

    <script type="module" src="./src/home-app.js"></script>
  </body>
</html>
