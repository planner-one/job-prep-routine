<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="theme-color" content="#3182f6" />
    <title>면접 준비 대시보드 | 취업 준비 루틴 보드</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="../assets/site-shell.css?v=2" />
    <link rel="stylesheet" href="assets/dashboard.css?v=9" />
  </head>
  <body>
    <a class="skip-link" href="#main-content">본문으로 바로가기</a>
    <header class="app-topbar screen-only">
      <a class="app-topbar-brand" href="../index.html" aria-label="취업 준비 루틴 보드 홈">
        <img src="assets/favicon.svg" alt="" width="28" height="28" />
        <span>취업 준비 루틴 보드</span>
      </a>
      <nav aria-label="주요 이동">
        <a href="../index.html">오늘</a>
        <a href="../weekly.html">주간</a>
        <a href="./" aria-current="page">면접</a>
        <a href="../roadmap.html">로드맵</a>
        <a href="../history.html">기록</a>
      </nav>
    </header>
    <div class="app-shell">
      <header class="hero">
        <div class="hero-copy">
          <p class="eyebrow">BACKEND INTERVIEW</p>
          <h1>한 질문씩, 실제 답변처럼</h1>
          <p class="hero-description">
            핵심문장을 먼저 말하고 근거와 꼬리질문을 필요한 만큼 펼쳐보세요.
          </p>
        </div>
        <div class="hero-rule" aria-label="답변 원칙">
          <span>핵심문장 먼저</span>
          <span>완료하면 다음 질문</span>
        </div>
      </header>

      <nav class="view-nav" aria-label="대시보드 보기">
        <button class="nav-button is-active" type="button" data-view="emphasis" aria-pressed="true">
          강조점
        </button>
        <button class="nav-button" type="button" data-view="difficulty" aria-pressed="false">
          난이도
        </button>
        <button class="nav-button" type="button" data-view="compact" aria-pressed="false">
          2시간 복습
        </button>
        <button class="nav-button" type="button" data-view="all" aria-pressed="false">
          전체 질문
        </button>
        <button class="nav-button" type="button" data-view="warnings" aria-pressed="false">
          확인 필요
        </button>
      </nav>

      <main id="main-content" tabindex="-1">
        <noscript>
          <p class="notice notice-warning">이 대시보드는 JavaScript가 활성화되어야 내용을 표시할 수 있습니다.</p>
        </noscript>
        <button
          id="sidebar-open"
          class="mobile-sidebar-toggle"
          type="button"
          aria-controls="question-sidebar"
          aria-expanded="false"
        >
          질문 목록 열기
        </button>
        <div class="dashboard-layout">
          <aside id="question-sidebar" class="question-sidebar" aria-label="현재 화면 질문 목록">
            <div class="sidebar-mobile-header">
              <strong>질문 목록</strong>
              <button id="sidebar-close" class="sidebar-close" type="button" aria-label="질문 목록 닫기">닫기</button>
            </div>
            <div id="question-sidebar-content" class="question-sidebar-content"></div>
          </aside>
          <button id="sidebar-backdrop" class="sidebar-backdrop" type="button" aria-label="질문 목록 닫기" hidden></button>
          <div id="dashboard-root"></div>
        </div>
        <p id="practice-status" class="visually-hidden" role="status" aria-live="polite"></p>
      </main>

      <footer>
        <p><a href="../index.html">루틴 보드로 돌아가기</a> · 질문별 연습 횟수만 이 브라우저에 저장</p>
        <p id="data-summary"></p>
      </footer>
    </div>

    <nav class="mobile-tabbar screen-only" aria-label="모바일 주요 이동">
      <a href="../index.html">오늘</a>
      <a href="../weekly.html">주간</a>
      <a href="./" aria-current="page">면접</a>
      <a href="../roadmap.html">로드맵</a>
      <a href="../history.html">기록</a>
    </nav>

    <dialog id="practice-reset-dialog" class="reset-dialog" aria-labelledby="reset-dialog-title">
      <form method="dialog">
        <p class="section-kicker">PRACTICE HISTORY</p>
        <h2 id="reset-dialog-title">모든 연습 횟수를 초기화할까요?</h2>
        <p>질문 106개의 누적 횟수가 이 브라우저에서 삭제되며 되돌릴 수 없습니다.</p>
        <div class="dialog-actions">
          <button class="dialog-button" type="submit" value="cancel">취소</button>
          <button id="practice-reset-confirm" class="dialog-button is-danger" type="submit" value="confirm">전체 초기화</button>
        </div>
      </form>
    </dialog>

    <script src="assets/data/behavioral.js?v=6" defer></script>
    <script src="assets/data/feedshop.js?v=6" defer></script>
    <script src="assets/data/architecture_cs.js?v=6" defer></script>
    <script src="assets/routines.js?v=6" defer></script>
    <script src="assets/dashboard.js?v=7" defer></script>
  </body>
</html>
