<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>취업 준비 운영 로드맵</title>
    <link rel="stylesheet" href="./assets/routine.css">
  </head>
  <body>
    <div class="app-shell roadmap-shell">
      <main class="daily-paper roadmap-paper" id="roadmap-page">
        <header class="daily-header roadmap-header screen-only">
          <div class="title-block">
            <p class="eyebrow">운영 기준표</p>
            <h1>취업 준비 운영 로드맵</h1>
            <p class="date-line">다섯 일정 변형을 한곳에서 비교합니다.</p>
          </div>

          <div class="roadmap-actions screen-only">
            <a class="board-link" href="./index.html">홈</a>
            <a class="board-link" href="./daily.html">데일리 포커스</a>
            <a class="pdf-button" href="./output/pdf/취업준비-운영-로드맵.pdf" download>PDF 다운로드</a>
          </div>
        </header>

        <section class="focus-anchors roadmap-principles screen-only" aria-label="핵심 운영 원칙">
          <article class="focus-anchor focus-anchor--application">
            <span class="principle-number" aria-hidden="true">01</span>
            <h2>지원은 하루 3~4개</h2>
            <p>공고 분석부터 자소서 조정·제출까지 한 흐름으로 끝낸다.</p>
          </article>
          <article class="focus-anchor focus-anchor--review">
            <span class="principle-number" aria-hidden="true">02</span>
            <h2>면접 언어를 매일 다듬기</h2>
            <p>이력서와 포트폴리오를 내 말로 설명하는 시간을 지킨다.</p>
          </article>
          <article class="focus-anchor focus-anchor--learning">
            <span class="principle-number" aria-hidden="true">03</span>
            <h2>학습은 결과물로 남기기</h2>
            <p>선택한 주제를 작은 구현이나 프로젝트 적용으로 연결한다.</p>
          </article>
        </section>

        <section class="roadmap-view-selector screen-only" aria-label="운영 일정 선택">
          <div class="roadmap-selector-heading">
            <div>
              <p class="eyebrow">일정 카테고리</p>
              <h2>확인할 하루를 선택하세요</h2>
            </div>
            <p>선택한 시간표 하나만 보여드립니다.</p>
          </div>
          <div class="roadmap-category-tabs" role="tablist" aria-label="운영 일정 카테고리">
            <button id="roadmap-category-workout" type="button" role="tab" data-roadmap-category="workout" aria-selected="true">운동일</button>
            <button id="roadmap-category-normal" type="button" role="tab" data-roadmap-category="normal" aria-selected="false">비운동일</button>
            <button id="roadmap-category-running" type="button" role="tab" data-roadmap-category="running" aria-selected="false">러닝일</button>
            <button id="roadmap-category-maintenance" type="button" role="tab" data-roadmap-category="maintenance" aria-selected="false">유지일</button>
          </div>
          <div id="roadmap-run-time-picker" class="roadmap-run-time-picker" aria-label="러닝 시작 시각" hidden>
            <span>러닝 시작</span>
            <button type="button" data-roadmap-run-start="21" aria-pressed="true">21시</button>
            <button type="button" data-roadmap-run-start="22" aria-pressed="false">22시</button>
          </div>
        </section>

        <div id="roadmap-reference-list" class="roadmap-reference-list"></div>
      </main>
    </div>

    <script type="module" src="./src/roadmap-app.js"></script>
  </body>
</html>
