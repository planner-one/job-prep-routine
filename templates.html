<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="백엔드 면접 152문항을 검색하고 오늘의 학습 큐와 학습 상태를 관리하는 페이지">
    <title>백엔드 면접 학습</title>
    <link rel="stylesheet" href="./assets/routine.css">
  </head>
  <body>
    <div class="app-shell interview-shell">
      <main class="daily-paper interview-paper" id="templates-page">
        <header class="daily-header interview-header">
          <div class="title-block">
            <p class="eyebrow">BACKEND INTERVIEW</p>
            <h1>백엔드 면접 학습</h1>
            <p class="date-line">152문항을 찾고, 오늘 답할 질문에 집중하세요.</p>
          </div>
          <div class="interview-header-actions screen-only">
            <a class="board-link" href="./index.html">홈</a>
          </div>
        </header>

        <section class="interview-overview" aria-labelledby="interview-stats-title">
          <div class="interview-section-heading">
            <div>
              <p class="section-kicker">학습 요약</p>
              <h2 id="interview-stats-title">전체 문항 진행 상태</h2>
            </div>
          </div>
          <div class="interview-stats" id="interview-stats" aria-live="polite">
            <article class="interview-stat-card">
              <span>전체 문항</span>
              <strong data-interview-stat="total">152</strong>
            </article>
            <article class="interview-stat-card interview-stat-card--learning">
              <span>학습 중</span>
              <strong data-interview-stat="studying">0</strong>
            </article>
            <article class="interview-stat-card interview-stat-card--review">
              <span>복습 필요</span>
              <strong data-interview-stat="review">0</strong>
            </article>
            <article class="interview-stat-card interview-stat-card--complete">
              <span>완료</span>
              <strong data-interview-stat="done">0</strong>
            </article>
          </div>
        </section>

        <section class="interview-queue" id="interview-queue" aria-labelledby="interview-queue-title">
          <div class="interview-section-heading">
            <div>
              <p class="section-kicker">오늘의 면접 큐</p>
              <h2 id="interview-queue-title">먼저 답할 다섯 문항</h2>
              <p>기준일 <time id="interview-queue-date">불러오는 중</time></p>
            </div>
          </div>
          <ol class="interview-queue-list" aria-label="오늘 학습할 면접 문항"></ol>
        </section>

        <section class="interview-catalog" aria-labelledby="interview-catalog-title">
          <div class="interview-section-heading">
            <div>
              <p class="section-kicker">문항 카탈로그</p>
              <h2 id="interview-catalog-title">조건을 조합해 질문 찾기</h2>
            </div>
          </div>

          <div class="interview-filters screen-only">
            <div class="interview-filter-field interview-filter-field--search">
              <label for="interview-search">질문 검색</label>
              <input type="search" id="interview-search" placeholder="질문·키워드 검색" autocomplete="off">
            </div>

            <fieldset class="interview-filter-field interview-category-field">
              <legend>카테고리</legend>
              <div class="interview-category-filters" id="interview-category-filters" role="group" aria-label="면접 문항 카테고리"></div>
            </fieldset>

            <div class="interview-filter-field">
              <label for="interview-status-filter">학습 상태</label>
              <select id="interview-status-filter">
                <option value="all">전체 상태</option>
                <option value="not-started">시작 전</option>
                <option value="learning">학습 중</option>
                <option value="complete">완료</option>
              </select>
            </div>

            <button type="button" class="interview-filter-toggle" id="interview-favorites-only" aria-pressed="false">즐겨찾기만 보기</button>
          </div>

          <div class="interview-results-heading">
            <p id="interview-results-count" aria-live="polite" aria-atomic="true">전체 152문항</p>
          </div>
          <ol class="interview-question-list" id="interview-list"></ol>
          <p class="interview-empty" id="interview-empty" hidden>선택한 조건에 맞는 문항이 없습니다.</p>
        </section>

        <p class="visually-hidden" id="interview-live" aria-live="polite"></p>
      </main>
    </div>

    <script type="module" src="./src/templates-app.js"></script>
  </body>
</html>
